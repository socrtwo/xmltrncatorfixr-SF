name: Lint XML Truncator-Fixer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint Perl, Python, and PWA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Perl syntax
        run: |
          echo "Checking Perl files..."
          errors=0
          for f in $(find . -name "*.pl" -o -name "*.pm" -o -name "*.cgi" | head -50); do
            echo "  Checking: $f"
            perl -c "$f" 2>&1 || errors=$((errors + 1))
          done
          if [ $errors -gt 0 ]; then
            echo "::warning::$errors file(s) had syntax issues"
          else
            echo "All Perl files passed syntax check!"
          fi

      - name: Check Python syntax
        run: |
          echo "Checking Python files..."
          python3 -m compileall -q cli || (echo "::error::Python compile failed"; exit 1)
          echo "All Python files compile."

      - name: Smoke-test CLI on a broken XML fixture
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils >/dev/null
          cat > /tmp/broken.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <root>
            <a>first</a>
            <b><c>well-formed nested content with enough bytes to be useful</c></b>
            <d>padding xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</d>
            <e>still fine here</e>
            <f>here is where it breaks: <not-closed
          EOF
          python3 cli/xmltrncatorfixr.py /tmp/broken.xml
          test -s /tmp/truncated-fixed-broken.xml
          xmllint --noout /tmp/truncated-fixed-broken.xml
          echo "Python CLI smoke test passed."
          cp /tmp/broken.xml /tmp/broken2.xml
          perl cli/xmltrncatorfixr.pl /tmp/broken2.xml
          test -s /tmp/truncated-fixed-broken2.xml
          xmllint --noout /tmp/truncated-fixed-broken2.xml
          echo "Perl CLI smoke test passed."
          # Edge case: a tiny fixture where truncation eats the whole document.
          # The CLI itself should still exit 0; we only assert the output exists.
          printf '<a>x<bad' > /tmp/tiny.xml
          python3 cli/xmltrncatorfixr.py --offset 2 /tmp/tiny.xml
          test -f /tmp/truncated-fixed-tiny.xml
          echo "Tiny-fixture edge case passed."

      - name: Validate PWA bundle
        run: |
          test -f web/manifest.webmanifest
          test -f web/sw.js
          test -f web/app/index.html
          test -f web/icons/icon-192.png
          test -f web/icons/icon-512.png
          python3 -c "import json,sys; json.load(open('web/manifest.webmanifest'))"
          echo "PWA bundle structure looks good."
